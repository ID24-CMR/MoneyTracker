{% extends "base.html" %}

{% block title %} Edit account {% endblock %}

{% block content %}

<div class="form-container">
    <div class="page-header">
        <h1>Edit Account</h1>
    </div>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn-primary">
            update Account
        </button>
        <a href="{% url 'account_list' %}" class="btn-secondary">Cancel</a>
    </form>
</div>

{% endblock %}
